name: prospecting

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prospecting}
      POSTGRES_USER: ${POSTGRES_USER:-prospecting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prospecting}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    command: >-
      sh -c '/opt/venv/bin/alembic upgrade head && exec /opt/venv/bin/uvicorn
      app.main:app --host 0.0.0.0 --port 8000 --reload'
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-prospecting}:${POSTGRES_PASSWORD:-prospecting}@db:5432/${POSTGRES_DB:-prospecting}
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-30}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      EXA_API_KEY: ${EXA_API_KEY:-}
      EXA_QPS: ${EXA_QPS:-10}
      EXA_MAX_CONCURRENCY: ${EXA_MAX_CONCURRENCY:-5}
      EXA_TIMEOUT_SECONDS: ${EXA_TIMEOUT_SECONDS:-30}
      EXA_MAX_RETRIES: ${EXA_MAX_RETRIES:-3}
      EXA_RETRY_BASE_SECONDS: ${EXA_RETRY_BASE_SECONDS:-0.5}
      EXA_RETRY_MAX_SECONDS: ${EXA_RETRY_MAX_SECONDS:-10}
      EXA_MAX_QUEUE_WAIT_SECONDS: ${EXA_MAX_QUEUE_WAIT_SECONDS:-30}
      EXA_MAX_PENDING_REQUESTS: ${EXA_MAX_PENDING_REQUESTS:-25}
      COMPANY_SEARCH_MAX_RESULTS: ${COMPANY_SEARCH_MAX_RESULTS:-50}
      COMPANY_SEARCH_CACHE_TTL_SECONDS: ${COMPANY_SEARCH_CACHE_TTL_SECONDS:-86400}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    command: pnpm dev --host 0.0.0.0 --port 5173
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
